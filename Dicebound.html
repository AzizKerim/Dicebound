<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dicebound</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #1f2937;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    #app {
      width: 100%;
      /* Shrink on short screens so HUD + game + dice bag always fit vertically. */
      max-width: min(980px, calc((100vh - 290px) * 2.09));
      background: #fff;
      border: 4px solid #111827;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    /* ---------- Top HUD ---------- */
    .hud {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: #fef3c7;
      border-bottom: 4px solid #111827;
      flex-wrap: wrap;
    }

    .level {
      background: #111827; color: #facc15;
      font-weight: 900; padding: 4px 10px; border-radius: 8px;
    }

    .bar { flex: 1; min-width: 150px; }
    .bar label { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; display: flex; justify-content: space-between; }
    .track { height: 14px; background: #e5e7eb; border: 3px solid #111827; border-radius: 8px; overflow: hidden; margin-top: 2px; }
    .fill { height: 100%; transition: width 0.3s; }
    #hpFill { background: #22c55e; }
    #expFill { background: #3b82f6; }
    #bossFill { background: #dc2626; }

    .stage { font-weight: 800; font-size: 14px; }

    #bossBar {
      display: none;
      width: 100%;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      color: #b91c1c;
      font-size: 13px;
    }
    #bossBar .track { flex: 1; margin: 0; }

    /* ---------- Game canvas ---------- */
    #game { display: block; width: 100%; height: auto; background: #bfe9ff; }

    /* ---------- Bottom panel: dice + bag ---------- */
    .panel {
      display: flex;
      gap: 14px;
      padding: 12px 14px;
      border-top: 4px solid #111827;
      background: #f9fafb;
      align-items: stretch;
      flex-wrap: wrap;
    }

    .roller {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 250px;
      gap: 6px;
    }

    .dice { display: flex; align-items: center; gap: 10px; }

    .die {
      width: 56px; height: 56px;
      background: #fff;
      border: 3px solid #111827;
      border-radius: 12px;
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 7px;
      box-shadow: 0 4px 0 #111827;
    }
    .die i { width: 10px; height: 10px; border-radius: 50%; background: #111827; place-self: center; }
    .die.rolling { animation: tumble 0.14s linear infinite; }
    @keyframes tumble {
      0% { transform: rotate(-14deg) translateY(-4px); }
      50% { transform: rotate(14deg) translateY(2px); }
      100% { transform: rotate(-14deg) translateY(-4px); }
    }

    .plus { font-weight: 900; font-size: 20px; }
    #sumText {
      font-size: 34px; font-weight: 900; min-width: 52px; text-align: center;
      background: #111827; color: #facc15; border-radius: 12px; padding: 2px 8px;
    }

    #actionText { font-weight: 900; font-size: 15px; text-align: center; min-height: 20px; }
    .pop { animation: pop 0.3s ease-out; }
    @keyframes pop { 0% { transform: scale(0.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

    .bagWrap { flex: 1; min-width: 300px; }
    .bagTitle { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #6b7280; margin-bottom: 4px; }
    #bag { display: grid; grid-template-columns: repeat(11, 1fr); gap: 5px; }

    .slot {
      border: 3px solid #111827;
      border-radius: 10px;
      background: #fff;
      text-align: center;
      padding: 4px 2px;
      transition: transform 0.15s, background 0.15s;
      cursor: help;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .slot .num { font-weight: 900; font-size: 15px; }
    .slot .icon {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--c); color: #fff; border: 2px solid #111827;
      display: grid; place-items: center; font-size: 12px; font-weight: 900;
    }
    .slot .name { font-size: 9px; font-weight: 700; line-height: 1.1; min-height: 20px; display: flex; align-items: center; }
    .slot .prob { width: 10px; height: 26px; background: #e5e7eb; border-radius: 3px; display: flex; align-items: flex-end; overflow: hidden; }
    .slot .probFill { width: 100%; background: var(--c); }
    .slot .pct { font-size: 9px; font-weight: 800; color: #6b7280; }
    .slot .count { font-size: 9px; color: #9ca3af; }
    .slot.changed { box-shadow: 0 0 0 3px #facc15; }
    #bag.shuffling .slot { animation: flip 0.45s ease-in-out 2; }
    @keyframes flip {
      0% { transform: rotateY(0) translateY(0); }
      50% { transform: rotateY(90deg) translateY(-8px); }
      100% { transform: rotateY(0) translateY(0); }
    }
    #shuffleText { color: #d97706; }
    .die.loaded { background: #fef3c7; }
    .slot.active { background: var(--c); transform: translateY(-6px) scale(1.08); }
    .slot.active .name, .slot.active .num, .slot.active .pct, .slot.active .count { color: #fff; }

    /* ---------- Overlays ---------- */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(17, 24, 39, 0.75);
      display: none;
      align-items: center; justify-content: center; flex-direction: column;
      gap: 16px;
      z-index: 10;
    }
    .overlay.show { display: flex; }
    .overlay h2 { color: #facc15; font-size: 40px; font-weight: 900; text-shadow: 0 4px 0 #111827; }
    .overlay p { color: #e5e7eb; font-weight: 600; }

    #cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 0 12px; }
    .card {
      width: 190px; padding: 18px 14px;
      background: #fff; border: 4px solid #111827; border-radius: 14px;
      box-shadow: 0 6px 0 #111827;
      font: inherit; cursor: pointer;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
      transition: transform 0.1s;
    }
    .card:hover { transform: translateY(-4px); background: #fef9c3; }
    .card b { font-size: 18px; }
    .card .tag {
      font-style: normal; font-size: 11px; font-weight: 900; letter-spacing: 0.1em;
      padding: 2px 8px; border-radius: 6px; color: #fff; background: #f97316;
    }
    .card.type-odds .tag { background: #8b5cf6; }
    .card.type-bag .tag { background: #0ea5e9; }
    .card.type-bag { background: #f0f9ff; }
    .card span { font-size: 14px; color: #4b5563; }
    .card .key {
      background: #111827; color: #facc15; font-weight: 900; width: 26px; height: 26px;
      border-radius: 50%; display: grid; place-items: center; font-size: 13px;
    }

    #end .box {
      background: #fff; border: 4px solid #111827; border-radius: 16px;
      padding: 28px 36px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center;
    }
    #end .box p { color: #374151; }
    #restart {
      font: inherit; font-weight: 900; font-size: 18px;
      padding: 10px 30px; border: 3px solid #111827; border-radius: 10px;
      background: #facc15; cursor: pointer; box-shadow: 0 4px 0 #111827;
    }
    #restart:active { transform: translateY(2px); box-shadow: 0 2px 0 #111827; }
  </style>

  <script>
// =====================================================================
// Dice logic and the Dice Bag.
// =====================================================================

const Dice = {
  // One fair six-sided die.
  d6() {
    return 1 + Math.floor(Math.random() * 6);
  },

  // Two independent d6 added together. This is what produces the
  // correct bell curve (7 is 6x more likely than 2 or 12).
  // Never replace this with a uniform 2..12 roll.
  roll2d6() {
    const a = Dice.d6();
    const b = Dice.d6();
    return { a, b, sum: a + b };
  },

  d100() {
    return 1 + Math.floor(Math.random() * 100);
  },

  // Exact probability of rolling `sum` on 2d6: number of combinations / 36.
  probability2d6(sum) {
    return (6 - Math.abs(sum - 7)) / 36;
  },

  // Exact distribution of the sum when `loaded` dice (0..2) reroll a 1 once.
  // A loaded die shows 1 with chance 1/36 and 2..6 with chance 7/36 each.
  distribution(loaded = 0) {
    const fair = [0, 1, 1, 1, 1, 1, 1].map(v => v / 6);
    const load = [0, 1 / 36, 7 / 36, 7 / 36, 7 / 36, 7 / 36, 7 / 36];
    const A = loaded >= 1 ? load : fair;
    const B = loaded >= 2 ? load : fair;
    const out = {};
    for (let s = 2; s <= 12; s++) out[s] = 0;
    for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) out[a + b] += A[a] * B[b];
    return out;
  }
};

// The Dice Bag maps each 2d6 result (2..12) to an action id.
class DiceBag {
  constructor(layout) {
    this.slots = {};
    this.timesRolled = {};
    for (let s = 2; s <= 12; s++) {
      this.slots[s] = layout[s];
      this.timesRolled[s] = 0;
    }
  }

  actionFor(sum) {
    return this.slots[sum];
  }

  record(sum) {
    this.timesRolled[sum]++;
  }

  // Replace a slot's action (Dice Bag swap reward).
  setSlot(sum, actionId) {
    this.slots[sum] = actionId;
  }

  // Randomly re-assign the bag's actions to the numbers 2..12.
  // pairSwaps = null shuffles everything; a number swaps only that many random pairs.
  shuffle(pairSwaps = null) {
    const keys = Object.keys(this.slots).map(Number);
    const values = keys.map(k => this.slots[k]);
    if (pairSwaps == null) {
      // Fisher-Yates
      for (let i = values.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [values[i], values[j]] = [values[j], values[i]];
      }
    } else {
      for (let n = 0; n < pairSwaps; n++) {
        const i = Math.floor(Math.random() * values.length);
        const j = Math.floor(Math.random() * values.length);
        [values[i], values[j]] = [values[j], values[i]];
      }
    }
    keys.forEach((k, i) => { this.slots[k] = values[i]; });
  }
}

  <script>
// =====================================================================
// Floating numbers, particles and shockwave rings (drawn in world space).
// =====================================================================

const Effects = {
  items: [],

  text(x, y, text, color, size = 26) {
    this.items.push({ type: "text", x, y, text, color, size, t: 0, life: 1.1 });
  },

  burst(x, y, color, count = 12, speed = 220) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.4 + Math.random() * 0.8);
      this.items.push({
        type: "particle", x, y, color,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120,
        size: 4 + Math.random() * 5, t: 0, life: 0.5 + Math.random() * 0.4
      });
    }
  },

  // Particles that float upward (healing sparkles).
  rise(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
      this.items.push({
        type: "particle", x: x + (Math.random() - 0.5) * 60, y: y + Math.random() * 40, color,
        vx: (Math.random() - 0.5) * 30, vy: -80 - Math.random() * 80, gravity: 0,
        size: 4 + Math.random() * 4, t: 0, life: 0.8 + Math.random() * 0.5
      });
    }
  },

  ring(x, y, color, maxR = 200) {
    this.items.push({ type: "ring", x, y, color, maxR, t: 0, life: 0.45 });
  },

  update(dt) {
    for (const e of this.items) {
      e.t += dt;
      if (e.type === "particle") {
        e.vy += (e.gravity ?? 600) * dt;
        e.x += e.vx * dt;
        e.y += e.vy * dt;
      }
    }
    this.items = this.items.filter(e => e.t < e.life);
  },

  draw(ctx) {
    for (const e of this.items) {
      const k = e.t / e.life;
      ctx.globalAlpha = 1 - k;
      if (e.type === "text") {
        const y = e.y - 60 * k;
        const pop = k < 0.15 ? 0.6 + (k / 0.15) * 0.6 : 1.2 - Math.min(0.2, k);
        ctx.font = `800 ${Math.round(e.size * pop)}px system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#1f2937";
        ctx.strokeText(e.text, e.x, y);
        ctx.fillStyle = e.color;
        ctx.fillText(e.text, e.x, y);
      } else if (e.type === "particle") {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size * (1 - k * 0.5), 0, Math.PI * 2);
        ctx.fill();
      } else if (e.type === "ring") {
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 10 * (1 - k) + 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.maxR * k, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  },

  clear() {
    this.items = [];
  }
};

  <script>
// =====================================================================
// Player, enemies and boss: state + geometric cartoon drawing.
// =====================================================================

const OUTLINE = "#1f2937";
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOut = k => 1 - (1 - k) * (1 - k);
// 0 -> 1 -> 0 bump over k in [0,1]
const bump = k => Math.sin(clamp01(k) * Math.PI);

function shape(ctx, fill, draw) {
  ctx.beginPath();
  draw();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();
}

// Shared animation + mood handling.
class Actor {
  constructor(x, hp) {
    this.x = x;
    this.renderX = x;
    this.hp = hp;
    this.maxHp = hp;
    this.anim = null;      // { name, t, dur }
    this.mood = "normal";  // normal | angry | hurt | happy | dead
    this.moodTimer = 0;
    this.flash = 0;        // white hit flash
    this.time = Math.random() * 10;
    this.dead = false;
    this.deadT = 0;
  }

  play(name, durMs) {
    this.anim = { name, t: 0, dur: durMs / 1000 / CONFIG.gameSpeed };
  }

  setMood(mood, seconds = 0.8) {
    this.mood = mood;
    this.moodTimer = seconds;
  }

  get alive() { return !this.dead; }

  update(dt) {
    this.time += dt;
    // Smoothly slide toward the logical position.
    this.renderX += (this.x - this.renderX) * (1 - Math.exp(-dt * 9));
    if (this.anim) {
      this.anim.t += dt;
      if (this.anim.t >= this.anim.dur) this.anim = null;
    }
    if (this.moodTimer > 0) {
      this.moodTimer -= dt;
      if (this.moodTimer <= 0 && !this.dead) this.mood = "normal";
    }
    if (this.flash > 0) this.flash -= dt;
    if (this.dead) this.deadT += dt;
  }

  animK() {
    return this.anim ? clamp01(this.anim.t / this.anim.dur) : 0;
  }

  drawHpBar(ctx, x, y, w) {
    if (this.dead) return;
    const k = this.hp / this.maxHp;
    ctx.fillStyle = OUTLINE;
    ctx.fillRect(x - w / 2 - 2, y - 2, w + 4, 12);
    ctx.fillStyle = "#e5e7eb";
    ctx.fillRect(x - w / 2, y, w, 8);
    ctx.fillStyle = k > 0.5 ? "#22c55e" : k > 0.25 ? "#f59e0b" : "#ef4444";
    ctx.fillRect(x - w / 2, y, w * k, 8);
  }
}

// Eyes + mouth, used by every character. `dir` = 1 looks right, -1 left.
function drawFace(ctx, cx, cy, mood, dir, scale = 1, blink = false) {
  const ex = 10 * scale, er = 7 * scale;
  ctx.lineWidth = 3;
  ctx.strokeStyle = OUTLINE;
  for (const side of [-1, 1]) {
    const x = cx + side * ex + dir * 4 * scale;
    const y = cy - 4 * scale;
    if (mood === "hurt" || mood === "dead") {
      // X eyes
      const s = 5 * scale;
      ctx.beginPath();
      ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
      ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
      ctx.stroke();
    } else if (mood === "happy") {
      // ^ ^ eyes
      ctx.beginPath();
      ctx.arc(x, y + 3 * scale, 6 * scale, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
    } else if (blink) {
      ctx.beginPath();
      ctx.moveTo(x - 6 * scale, y); ctx.lineTo(x + 6 * scale, y);
      ctx.stroke();
    } else {
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x, y, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = OUTLINE;
      ctx.beginPath(); ctx.arc(x + dir * 2.5 * scale, y, 3.2 * scale, 0, Math.PI * 2); ctx.fill();
      if (mood === "angry") {
        // Brows slant down toward the middle of the face.
        ctx.beginPath();
        ctx.moveTo(x + side * 8 * scale, y - 14 * scale);
        ctx.lineTo(x - side * 8 * scale, y - 8 * scale);
        ctx.stroke();
      }
    }
  }
  // Mouth
  const my = cy + 12 * scale, mx = cx + dir * 4 * scale;
  ctx.beginPath();
  if (mood === "happy") {
    ctx.fillStyle = "#7f1d1d";
    ctx.arc(mx, my - 3 * scale, 9 * scale, 0, Math.PI);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if (mood === "hurt") {
    ctx.fillStyle = "#7f1d1d";
    ctx.ellipse(mx, my, 6 * scale, 8 * scale, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  } else if (mood === "angry") {
    ctx.moveTo(mx - 8 * scale, my + 2 * scale);
    ctx.lineTo(mx + 8 * scale, my - 2 * scale);
    ctx.stroke();
  } else if (mood === "dead") {
    ctx.moveTo(mx - 7 * scale, my); ctx.lineTo(mx + 7 * scale, my);
    ctx.stroke();
  } else {
    ctx.arc(mx, my - 4 * scale, 6 * scale, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }
}

// ---------------------------------------------------------------------
class Player extends Actor {
  constructor() {
    super(CONFIG.player.startX, CONFIG.player.maxHp);
    this.level = 1;
    this.exp = 0;
    this.expToNext = CONFIG.exp.firstLevel;
    this.dodgeCharges = 0; // each charge blocks one enemy attack
    this.stats = {
      // power
      damageMult: 1, healMult: 1, dodgeChance: 0,
      damageTaken: 1, walkMult: 1, selfDamageMult: 1,
      // odds
      loadedDice: 0, secondChance: false, critChance: 0
    };
  }

  // Pose offsets for the current animation.
  pose() {
    const k = this.animK();
    const p = { ox: 0, oy: 0, sx: 1, sy: 1, rot: 0, sword: -0.3, legs: 0, glow: null };
    const name = this.anim ? this.anim.name : "idle";

    if (this.dead) {
      const d = clamp01(this.deadT * 2);
      p.rot = -d * Math.PI / 2; p.oy = 0; p.sword = 1.4;
      return p;
    }

    switch (name) {
      case "idle":
        p.oy = Math.sin(this.time * 3) * 2;
        p.sy = 1 + Math.sin(this.time * 3) * 0.03;
        p.sword = -0.3 + Math.sin(this.time * 3) * 0.08;
        break;
      case "walk":
        p.oy = -Math.abs(Math.sin(k * Math.PI * 3)) * 16;
        p.legs = Math.sin(k * Math.PI * 6);
        p.sy = 1 + Math.abs(Math.sin(k * Math.PI * 3)) * 0.08;
        break;
      case "attack":
        if (k < 0.35) { p.ox = -10 * (k / 0.35); p.sword = -0.3 - 1.3 * (k / 0.35); }
        else { const j = (k - 0.35) / 0.65; p.ox = -10 + 45 * bump(j); p.sword = -1.6 + 3.0 * easeOut(clamp01(j * 2)); }
        p.legs = 0.4 * bump(k);
        break;
      case "heavy":
      case "crit":
        if (k < 0.45) { const j = k / 0.45; p.ox = -16 * j; p.sy = 1 - 0.18 * j; p.sx = 1 + 0.12 * j; p.sword = -0.3 - 1.9 * j; }
        else { const j = (k - 0.45) / 0.55; p.ox = -16 + 60 * bump(j); p.oy = -40 * bump(j); p.sword = -2.2 + 4.0 * easeOut(clamp01(j * 1.6)); p.sy = 1 + 0.1 * bump(j); }
        if (name === "crit") p.glow = "rgba(255, 214, 0, 0.55)";
        break;
      case "special":
        p.rot = k * Math.PI * 2;
        p.oy = -50 * bump(k);
        p.sword = 1.2;
        p.glow = "rgba(56, 189, 248, 0.5)";
        break;
      case "hurt":
        p.ox = -24 * bump(Math.min(1, k * 1.5));
        p.sx = 1 + 0.3 * bump(k); p.sy = 1 - 0.3 * bump(k);
        p.rot = -0.25 * bump(k);
        p.sword = 1.0;
        break;
      case "heal":
        p.sy = 1 + 0.12 * bump(k); p.sx = 1 - 0.06 * bump(k);
        p.glow = `rgba(34, 197, 94, ${0.5 * bump(k)})`;
        break;
      case "fullheal":
        p.oy = -60 * bump(k);
        p.rot = k * Math.PI * 2;
        p.glow = `rgba(250, 204, 21, ${0.8 * bump(k)})`;
        p.sword = -1.2;
        break;
      case "dodge":
        p.ox = -30 * bump(k); p.oy = -20 * bump(k); p.rot = -0.35 * bump(k);
        break;
      case "victory":
        p.oy = -Math.abs(Math.sin(k * Math.PI * 4)) * 30;
        p.sword = -2.2;
        break;
    }
    return p;
  }

  draw(ctx, groundY) {
    const p = this.pose();
    const x = this.renderX + p.ox;
    const y = groundY + p.oy;
    ctx.save();
    if (this.dead) ctx.globalAlpha = Math.max(0.35, 1 - this.deadT * 0.4);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.ellipse(this.renderX + p.ox, groundY + 4, 30 * (1 + p.oy / 200), 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(x, y);
    ctx.rotate(p.rot);
    ctx.scale(p.sx, p.sy);

    const bodyY = -62;
    // Glow behind body
    if (p.glow) {
      ctx.fillStyle = p.glow;
      ctx.beginPath(); ctx.arc(0, bodyY, 52, 0, Math.PI * 2); ctx.fill();
    }

    // Legs (stick lines)
    ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.strokeStyle = OUTLINE;
    for (const side of [-1, 1]) {
      const swing = p.legs * side * 10;
      ctx.beginPath();
      ctx.moveTo(side * 10, bodyY + 24);
      ctx.lineTo(side * 12 + swing, 0);
      ctx.stroke();
    }

    // Back arm
    ctx.beginPath(); ctx.moveTo(-24, bodyY + 6); ctx.lineTo(-38, bodyY + 22); ctx.stroke();

    // Body
    const bodyColor = this.flash > 0 ? "#ffffff" : "#ffd23f";
    shape(ctx, bodyColor, () => ctx.arc(0, bodyY, 30, 0, Math.PI * 2));

    // Tiny hat tuft
    shape(ctx, "#ff6b6b", () => {
      ctx.moveTo(-8, bodyY - 28); ctx.lineTo(0, bodyY - 46); ctx.lineTo(8, bodyY - 28); ctx.closePath();
    });

    const blink = Math.sin(this.time * 1.3) > 0.985;
    drawFace(ctx, 4, bodyY, this.mood, 1, 1, blink);

    // Front arm + sword
    ctx.save();
    ctx.translate(22, bodyY + 8);
    ctx.rotate(p.sword);
    ctx.lineWidth = 5; ctx.strokeStyle = OUTLINE;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(18, 0); ctx.stroke();
    shape(ctx, "#cbd5e1", () => ctx.rect(18, -4, 40, 8));        // blade
    shape(ctx, "#8b5e34", () => ctx.rect(14, -9, 6, 18));        // guard
    ctx.restore();

    // Dodge bubble
    if (this.dodgeCharges > 0) {
      ctx.strokeStyle = "rgba(56, 189, 248, 0.9)";
      ctx.fillStyle = "rgba(56, 189, 248, 0.15)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, bodyY + 10, 62 + Math.sin(this.time * 6) * 3, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------------
class Enemy extends Actor {
  constructor(type, x) {
    const def = CONFIG.enemies[type];
    super(x, def.hp);
    this.type = type;
    this.def = def;
    this.active = false; // becomes true when the player is within aggro range
    this.isBoss = false;
  }

  pose() {
    const k = this.animK();
    const p = { ox: 0, oy: 0, sx: 1, sy: 1 };
    const name = this.anim ? this.anim.name : "idle";
    if (this.dead) {
      const d = clamp01(this.deadT * 3);
      p.sx = 1 + d * 0.6; p.sy = 1 - d * 0.85;
      return p;
    }
    switch (name) {
      case "idle": {
        const b = Math.sin(this.time * 4);
        p.sy = 1 + b * 0.06; p.sx = 1 - b * 0.04;
        break;
      }
      case "walk":
        p.oy = -Math.abs(Math.sin(k * Math.PI * 2)) * 14;
        p.sy = 1 + 0.1 * Math.sin(k * Math.PI * 4);
        break;
      case "attack":
        p.ox = -40 * bump(k); p.oy = -18 * bump(k);
        p.sx = 1 + 0.15 * bump(k);
        break;
      case "hurt":
        p.ox = 20 * bump(k); p.sx = 1.25 - 0.25 * k; p.sy = 0.8 + 0.2 * k;
        break;
    }
    return p;
  }

  draw(ctx, groundY) {
    if (this.dead && this.deadT > 0.6) return;
    const p = this.pose();
    const x = this.renderX + p.ox;
    const y = groundY + p.oy;
    ctx.save();
    if (this.dead) ctx.globalAlpha = 1 - this.deadT / 0.6;

    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(this.renderX, groundY + 4, 30, 7, 0, 0, Math.PI * 2); ctx.fill();

    ctx.translate(x, y);
    ctx.scale(p.sx, p.sy);
    const color = this.flash > 0 ? "#ffffff" : this.def.color;

    let faceY;
    if (this.type === "blob") {
      // Dome-shaped slime
      shape(ctx, color, () => {
        ctx.moveTo(-34, 0);
        ctx.bezierCurveTo(-36, -60, 36, -60, 34, 0);
        ctx.closePath();
      });
      faceY = -24;
    } else {
      // Spiky triangle creature
      shape(ctx, color, () => {
        ctx.moveTo(-34, 0); ctx.lineTo(-24, -40); ctx.lineTo(-30, -50); ctx.lineTo(-12, -54);
        ctx.lineTo(0, -82); ctx.lineTo(12, -54); ctx.lineTo(30, -50); ctx.lineTo(24, -40);
        ctx.lineTo(34, 0); ctx.closePath();
      });
      faceY = -28;
    }
    ctx.restore();

    // Face drawn unscaled vertically so it stays readable while squashing
    ctx.save();
    if (this.dead) ctx.globalAlpha = 1 - this.deadT / 0.6;
    ctx.translate(x, y + faceY * p.sy);
    const mood = this.dead ? "dead" : this.mood === "normal" ? "angry" : this.mood;
    drawFace(ctx, 0, 0, mood, -1, 0.85);
    ctx.restore();

    this.drawHpBar(ctx, this.renderX, groundY - (this.type === "blob" ? 70 : 100), 56);
  }
}

// The boss: a giant evil die that rolls a D100 each turn.
class Boss extends Enemy {
  constructor(x) {
    super(CONFIG.boss.summonType, x); // base init, overridden below
    const def = CONFIG.boss;
    this.def = { ...def, color: "#b91c1c" };
    this.type = "boss";
    this.isBoss = true;
    this.hp = this.maxHp = def.hp;
    this.defending = false;
    // D100 badge state shown above the boss.
    this.d100 = { visible: false, rolling: false, value: 0, label: "" };
  }

  pose() {
    const p = super.pose();
    const k = this.animK();
    const name = this.anim ? this.anim.name : "idle";
    if (name === "heavy" || name === "devastate") {
      p.oy = -(name === "devastate" ? 120 : 60) * bump(k);
      p.ox = -50 * bump(k);
    } else if (name === "summon") {
      p.sy = 1 + 0.2 * bump(k); p.sx = 1 - 0.1 * bump(k);
    } else if (name === "fumble") {
      p.ox = 0; p.oy = 0; p.sx = 1 + 0.3 * bump(k); p.sy = 1 - 0.4 * bump(k);
    }
    return p;
  }

  draw(ctx, groundY) {
    if (this.dead && this.deadT > 1.2) return;
    const p = this.pose();
    const x = this.renderX + p.ox;
    const y = groundY + p.oy;
    const s = 120;

    ctx.save();
    if (this.dead) ctx.globalAlpha = 1 - this.deadT / 1.2;

    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath(); ctx.ellipse(this.renderX, groundY + 5, 70, 10, 0, 0, Math.PI * 2); ctx.fill();

    ctx.translate(x, y);
    const wobble = this.dead ? this.deadT * 1.5 : Math.sin(this.time * 2) * 0.03;
    ctx.rotate(wobble);
    ctx.scale(p.sx, p.sy);

    // Horns
    for (const side of [-1, 1]) {
      shape(ctx, "#f5f5f4", () => {
        ctx.moveTo(side * 30, -s); ctx.lineTo(side * 62, -s - 36); ctx.lineTo(side * 52, -s); ctx.closePath();
      });
    }
    // Die body
    const body = this.flash > 0 ? "#ffffff" : this.defending ? "#1e40af" : "#b91c1c";
    shape(ctx, body, () => ctx.roundRect(-s / 2, -s, s, s, 18));
    // Pips in the corners
    ctx.fillStyle = "#fde68a";
    for (const [px, py] of [[-38, -102], [38, -102], [-38, -18], [38, -18]]) {
      ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
    }
    drawFace(ctx, 0, -62, this.dead ? "dead" : this.mood === "normal" ? "angry" : this.mood, -1, 1.5);

    // Defensive stance shield
    if (this.defending && !this.dead) {
      ctx.strokeStyle = "rgba(147, 197, 253, 0.95)";
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, -s / 2, 90, Math.PI * 0.6, Math.PI * 1.4); ctx.stroke();
    }
    ctx.restore();

    if (!this.dead) this.drawD100(ctx, this.renderX, groundY - s - 90);
  }

  // Evil decagon "D100" with the rolled number and the telegraphed action.
  drawD100(ctx, x, y) {
    const d = this.d100;
    if (!d.visible) return;
    const value = d.rolling ? Dice.d100() : d.value;
    const r = 34;
    ctx.save();
    ctx.translate(x, y);
    if (d.rolling) ctx.rotate(Math.sin(this.time * 30) * 0.4);
    shape(ctx, "#111827", () => {
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
    });
    ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = value === 100 ? "#facc15" : "#ef4444";
    ctx.font = "900 24px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(value, 0, 1);
    ctx.restore();

    if (!d.rolling && d.label) {
      ctx.font = "800 18px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const w = ctx.measureText(d.label).width + 24;
      ctx.fillStyle = "#111827";
      ctx.beginPath(); ctx.roundRect(x - w / 2, y - 66, w, 30, 8); ctx.fill();
      ctx.fillStyle = "#fca5a5";
      ctx.fillText(d.label, x, y - 51);
    }
  }
}

  <script>
// =====================================================================
// DOM UI: HUD bars, dice, Dice Bag, level-up and end screens.
// =====================================================================

// Look per action kind: color + simple glyph.
const KIND_STYLE = {
  bad:     { color: "#ef4444", icon: "✕" },
  attack:  { color: "#f97316", icon: "⚔" },
  special: { color: "#a855f7", icon: "★" },
  heal:    { color: "#22c55e", icon: "✚" },
  move:    { color: "#3b82f6", icon: "➜" },
  defend:  { color: "#06b6d4", icon: "◯" }
};

// Pip layout on a 3x3 grid (cells 1..9).
const PIP_CELLS = {
  1: [5], 2: [3, 7], 3: [3, 5, 7], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9]
};

const $ = id => document.getElementById(id);

const UI = {
  init(bag) {
    this.bag = bag;
    this.buildBag();
    this.drawDie($("die1"), 1);
    this.drawDie($("die2"), 1);
  },

  // ---------- HUD ----------
  updateHud(player, stageLabel) {
    $("hpFill").style.width = (100 * player.hp / player.maxHp) + "%";
    $("hpText").textContent = `${Math.ceil(player.hp)} / ${player.maxHp}`;
    $("expFill").style.width = (100 * player.exp / player.expToNext) + "%";
    $("expText").textContent = `${player.exp} / ${player.expToNext}`;
    $("levelText").textContent = `LV ${player.level}`;
    $("stageText").textContent = stageLabel;
  },

  updateBossBar(boss) {
    const show = boss && boss.active && !boss.dead;
    $("bossBar").style.display = show ? "flex" : "none";
    if (show) $("bossFill").style.width = (100 * boss.hp / boss.maxHp) + "%";
  },

  setAction(text, kind) {
    const el = $("actionText");
    el.textContent = text;
    el.style.color = kind ? KIND_STYLE[kind].color : "#6b7280";
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
  },

  // ---------- Dice ----------
  drawDie(el, value) {
    el.innerHTML = "";
    for (const cell of PIP_CELLS[value]) {
      const pip = document.createElement("i");
      pip.style.gridRow = Math.ceil(cell / 3);
      pip.style.gridColumn = ((cell - 1) % 3) + 1;
      el.appendChild(pip);
    }
  },

  // Tumble both dice for `ms`, then land on the real values.
  async animateRoll(a, b, ms) {
    const d1 = $("die1"), d2 = $("die2");
    $("sumText").textContent = "?";
    this.clearHighlight();
    d1.classList.add("rolling"); d2.classList.add("rolling");
    const end = performance.now() + ms;
    while (performance.now() < end) {
      this.drawDie(d1, Dice.d6());
      this.drawDie(d2, Dice.d6());
      await sleep(70, true);
    }
    d1.classList.remove("rolling"); d2.classList.remove("rolling");
    this.drawDie(d1, a);
    this.drawDie(d2, b);
    const sum = $("sumText");
    sum.textContent = a + b;
    sum.classList.remove("pop"); void sum.offsetWidth; sum.classList.add("pop");
  },

  // ---------- Dice Bag ----------
  // `probs` = exact chance per number (changes with Loaded Die upgrades).
  buildBag(probs = Dice.distribution(0)) {
    const root = $("bag");
    root.innerHTML = "";
    for (let s = 2; s <= 12; s++) {
      const action = CONFIG.actions[this.bag.actionFor(s)];
      const style = KIND_STYLE[action.kind];
      const pct = probs[s] * 100;
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.id = "slot" + s;
      slot.style.setProperty("--c", style.color);
      slot.title = `${s}: ${action.name}, ${pct.toFixed(2)}% chance`;
      slot.innerHTML = `
        <div class="num">${s}</div>
        <div class="icon">${style.icon}</div>
        <div class="name">${action.name}</div>
        <div class="prob"><div class="probFill" style="height:${pct / 16.67 * 100}%"></div></div>
        <div class="pct">${pct.toFixed(1)}%</div>
        <div class="count" id="count${s}">×${this.bag.timesRolled[s]}</div>`;
      root.appendChild(slot);
    }
  },

  // Rolls left until the next shuffle (0 = shuffle disabled).
  setShuffleCountdown(n) {
    $("shuffleText").textContent = n > 0 ? `· shuffles in ${n} roll${n === 1 ? "" : "s"}` : "";
  },

  // Spin the slots, rebuild with the new layout, and flag slots whose action changed.
  async animateShuffle(probs, before, ms) {
    const root = $("bag");
    root.classList.add("shuffling");
    await sleep(ms / 2, true);
    this.buildBag(probs);
    for (let s = 2; s <= 12; s++) {
      if (before[s] !== this.bag.slots[s]) $("slot" + s).classList.add("changed");
    }
    await sleep(ms / 2, true);
    root.classList.remove("shuffling");
  },

  // Flag one slot as freshly swapped.
  markSlot(sum) {
    $("slot" + sum).classList.add("changed");
  },

  // Briefly re-tumble one die (Loaded Die reroll).
  async rerollDie(index, value, ms) {
    const el = $(index === 0 ? "die1" : "die2");
    el.classList.add("rolling", "loaded");
    const end = performance.now() + ms;
    while (performance.now() < end) {
      this.drawDie(el, Dice.d6());
      await sleep(60, true);
    }
    el.classList.remove("rolling");
    this.drawDie(el, value);
    setTimeout(() => el.classList.remove("loaded"), 400);
  },

  setSum(sum) {
    const el = $("sumText");
    el.textContent = sum;
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  },

  highlightSlot(sum) {
    this.clearHighlight();
    $("slot" + sum).classList.add("active");
    $("count" + sum).textContent = "×" + this.bag.timesRolled[sum];
  },

  clearHighlight() {
    document.querySelectorAll(".slot.active").forEach(s => s.classList.remove("active"));
  },

  // ---------- Level-up ----------
  // Shows 3 cards and resolves with the chosen upgrade.
  chooseUpgrade(level, options) {
    return new Promise(resolve => {
      $("levelupTitle").textContent = `LEVEL ${level}!`;
      const cards = $("cards");
      cards.innerHTML = "";
      options.forEach((u, i) => {
        const btn = document.createElement("button");
        btn.className = "card";
        const type = u.type || "power";
        const tag = { power: "POWER", odds: "ODDS", bag: "DICE BAG" }[type];
        btn.classList.add("type-" + type);
        btn.innerHTML = `<span class="key">${i + 1}</span><em class="tag">${tag}</em><b>${u.name}</b><span>${u.desc}</span>`;
        btn.onclick = () => finish(u);
        cards.appendChild(btn);
      });
      const onKey = e => {
        const i = Number(e.key) - 1;
        if (options[i]) finish(options[i]);
      };
      const finish = u => {
        document.removeEventListener("keydown", onKey);
        $("levelup").classList.remove("show");
        resolve(u);
      };
      document.addEventListener("keydown", onKey);
      $("levelup").classList.add("show");
    });
  },

  // ---------- Victory / defeat ----------
  showEnd(won, summary) {
    $("endTitle").textContent = won ? "VICTORY!" : "DEFEATED";
    $("endTitle").style.color = won ? "#16a34a" : "#dc2626";
    $("endText").textContent = summary;
    $("end").classList.add("show");
  },

  hideEnd() {
    $("end").classList.remove("show");
  }
};
  </script>
  <script>
// =====================================================================
// Game: turn loop, combat, progression, rendering.
// =====================================================================

// ?speed=3 in the URL fast-forwards the game.
const params = new URLSearchParams(location.search);
if (params.has("speed")) CONFIG.gameSpeed = Number(params.get("speed")) || 1;

// Waits `ms` scaled by game speed (pass raw=true to skip scaling).
function sleep(ms, raw = false) {
  return new Promise(r => setTimeout(r, raw ? ms : ms / CONFIG.gameSpeed));
}

const T = CONFIG.timing;
const W = CONFIG.world;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const Game = {
  state: "playing", // playing | won | lost
  camX: 0,
  shakeT: 0,
  shakeMag: 0,
  turn: 0,

  init() {
    this.canvas = document.getElementById("game");
    this.ctx = this.canvas.getContext("2d");
    this.canvas.width = W.width;
    this.canvas.height = W.height;

    this.player = new Player();
    this.enemies = CONFIG.spawns.map(s => new Enemy(s.type, s.x));
    this.boss = new Boss(CONFIG.boss.x);
    this.enemies.push(this.boss);
    this.bag = new DiceBag(CONFIG.diceBag);

    // ?start=boss skips straight to the boss fight (handy for demos/testing).
    if (params.get("start") === "boss") {
      this.enemies.forEach(e => { if (!e.isBoss) { e.dead = true; e.deadT = 99; } });
      this.player.x = this.player.renderX = CONFIG.boss.x - 300;
      this.camX = this.player.x - 260;
    }

    UI.init(this.bag);
    UI.setShuffleCountdown(CONFIG.bagShuffle.everyRolls);
    UI.setAction("Get ready...");
    this.refreshHud();

    document.getElementById("restart").onclick = () => location.reload();

    this.last = performance.now();
    requestAnimationFrame(t => this.frame(t));
    this.turnLoop();
  },

  // -------------------------------------------------------------------
  // TURN LOOP: roll -> reveal -> highlight -> player acts -> enemies act
  // -------------------------------------------------------------------
  async turnLoop() {
    await sleep(800);
    while (this.state === "playing") {
      this.turn++;
      await this.playerTurn();
      if (this.checkEnd()) break;
      await this.handleLevelUps();

      await this.enemyTurns();
      if (this.checkEnd()) break;
      await this.handleLevelUps();

      const every = CONFIG.bagShuffle.everyRolls;
      if (every > 0) {
        if (this.turn % every === 0) await this.shuffleBag();
        UI.setShuffleCountdown(every - (this.turn % every));
      }

      await sleep(T.betweenTurns);
    }
  },

  async playerTurn() {
    let { a, b, sum } = await this.rollWithModifiers();
    let id = this.bag.actionFor(sum);

    // Second Chance upgrade: one free reroll when the bag says "Take Damage".
    if (id === "takeDamage" && this.player.stats.secondChance) {
      UI.highlightSlot(sum);
      UI.setAction(`${sum} → Take Damage... SECOND CHANCE!`, "special");
      await sleep(T.reveal);
      ({ a, b, sum } = await this.rollWithModifiers());
      id = this.bag.actionFor(sum);
    }

    this.bag.record(sum);
    const action = CONFIG.actions[id];
    UI.highlightSlot(sum);
    UI.setAction(`${a} + ${b} = ${sum}  →  ${action.name}`, action.kind);
    await sleep(T.reveal);

    await PlayerActions[id](action);
    this.refreshHud();
  },

  // Roll 2d6 with the tumbling animation, then apply Loaded Die rerolls.
  async rollWithModifiers() {
    const dice = [Dice.d6(), Dice.d6()];
    UI.setAction("Rolling...");
    await UI.animateRoll(dice[0], dice[1], T.rollAnim / CONFIG.gameSpeed);

    for (let i = 0; i < this.player.stats.loadedDice; i++) {
      if (dice[i] !== 1) continue;
      dice[i] = Dice.d6();
      UI.setAction("Loaded Die rerolls the 1!", "special");
      await UI.rerollDie(i, dice[i], 350 / CONFIG.gameSpeed);
      UI.setSum(dice[0] + dice[1]);
    }
    return { a: dice[0], b: dice[1], sum: dice[0] + dice[1] };
  },

  // Exact chances for each number, given the player's Loaded Die upgrades.
  probs() {
    return Dice.distribution(this.player.stats.loadedDice);
  },

  refreshBag() {
    UI.buildBag(this.probs());
  },

  // Every N rolls the Dice Bag re-assigns its actions to random numbers.
  async shuffleBag() {
    const before = { ...this.bag.slots };
    this.bag.shuffle(CONFIG.bagShuffle.pairSwaps);
    UI.setAction("DICE BAG SHUFFLE!", "special");
    await UI.animateShuffle(this.probs(), before, T.bagShuffle / CONFIG.gameSpeed);
  },

  // A level-up card that replaces one action in the Dice Bag.
  makeBagSwapCard() {
    const cfg = CONFIG.bagSwap;
    const slots = Object.keys(this.bag.slots).map(Number);
    const bad = slots.filter(s => this.bag.slots[s] === "takeDamage");
    const slot = bad.length && Math.random() < cfg.badSlotBias ? pick(bad) : pick(slots);
    const from = this.bag.slots[slot];
    const to = pick(cfg.offers.filter(id => id !== from));
    const pct = (this.probs()[slot] * 100).toFixed(1);
    return {
      type: "bag",
      slot,
      name: `${CONFIG.actions[from].name} → ${CONFIG.actions[to].name}`,
      desc: `Swap it on ${slot} (${pct}% right now). It stays in your bag; shuffles only move it.`,
      apply: () => this.bag.setSlot(slot, to)
    };
  },

  async enemyTurns() {
    const p = this.player;
    // Wake up enemies that are close enough.
    // The boss waits until every regular (non-summoned) enemy is defeated.
    const minionsLeft = this.enemies.some(e => e.alive && !e.isBoss && !e.summoned);
    for (const e of this.enemies) {
      if (e.isBoss && minionsLeft) continue;
      if (e.alive && !e.active && e.x - p.x < W.aggroRange) {
        e.active = true;
        e.setMood("angry", 1);
        Effects.text(e.x, W.groundY - (e.isBoss ? 230 : 110), "!", "#facc15", 34);
      }
    }
    const acting = this.enemies.filter(e => e.alive && e.active).sort((a, b) => a.x - b.x);
    for (const e of acting) {
      if (this.state !== "playing" || p.dead || e.dead) continue;
      if (e.isBoss) await this.bossTurn(e);
      else await this.enemyAct(e);
      this.refreshHud();
    }
  },

  // Regular enemy: attack if in range, otherwise step toward the player.
  async enemyAct(e) {
    const p = this.player;
    if (e.x - p.x <= e.def.range) {
      e.play("attack", T.enemyStep);
      await sleep(T.enemyStep * 0.5);
      this.hitPlayer(e.def.damage);
      await sleep(T.enemyStep * 0.5);
    } else if (this.stepToward(e, e.def.speed)) {
      e.play("walk", T.enemyStep);
      await sleep(T.enemyStep * 0.6);
    }
  },

  // Move an enemy left toward the player without overlapping anyone. Returns true if it moved.
  stepToward(e, speed) {
    const p = this.player;
    const ahead = this.enemies.filter(o => o !== e && o.alive && o.x < e.x);
    const frontX = ahead.length ? Math.max(...ahead.map(o => o.x)) : -Infinity;
    const gap = e.isBoss ? 100 : 60;
    const targetX = Math.max(e.x - speed, p.x + e.def.range * 0.85, frontX + gap);
    if (targetX >= e.x - 1) return false;
    e.x = targetX;
    return true;
  },

  // -------------------------------------------------------------------
  // BOSS: rolls a D100, telegraphs the result, then acts.
  // -------------------------------------------------------------------
  async bossTurn(b) {
    b.defending = false; // stance lasts until its next turn
    if (this.stepToward(b, b.def.speed)) b.play("walk", T.enemyStep);

    b.d100 = { visible: true, rolling: true, value: 0, label: "" };
    UI.setAction("The Evil D100 is rolling...", "bad");
    await sleep(T.bossRoll);

    const roll = Dice.d100();
    const entry = CONFIG.boss.table.find(t => roll <= t.max);
    b.d100 = { visible: true, rolling: false, value: roll, label: entry.name };
    UI.setAction(`Boss rolled ${roll}  →  ${entry.name}`, "bad");
    await sleep(T.bossReveal);

    await BossActions[entry.id](b, entry);
    b.d100.label = "";
  },

  // -------------------------------------------------------------------
  // COMBAT HELPERS
  // -------------------------------------------------------------------
  nearestEnemy(range) {
    let best = null;
    for (const e of this.enemies) {
      if (!e.alive) continue;
      const d = Math.abs(e.x - this.player.x);
      if (d <= range && (!best || d < Math.abs(best.x - this.player.x))) best = e;
    }
    return best;
  },

  enemiesInRange(range) {
    return this.enemies.filter(e => e.alive && Math.abs(e.x - this.player.x) <= range);
  },

  // Player deals damage to an enemy.
  damageEnemy(e, base, color = "#ffffff", size = 26) {
    let dmg = Math.round(base * this.player.stats.damageMult);
    // Keen Eye upgrade: any hit can crit.
    if (Math.random() < this.player.stats.critChance) {
      dmg = Math.round(dmg * CONFIG.critMultiplier);
      color = "#facc15";
      size += 8;
      Effects.text(e.x, W.groundY - (e.isBoss ? 220 : 160), "LUCKY CRIT!", "#facc15", 20);
    }
    if (e.defending) {
      dmg = Math.round(dmg * (1 - CONFIG.boss.table.find(t => t.id === "defend").reduction));
      Effects.text(e.x, W.groundY - 190, "BLOCKED", "#93c5fd", 20);
    }
    e.hp = Math.max(0, e.hp - dmg);
    e.flash = 0.12;
    if (!e.isBoss) e.active = true; // the boss wakes up on its own terms
    e.play("hurt", 350);
    e.setMood("hurt", 0.5);
    Effects.text(e.x, W.groundY - (e.isBoss ? 150 : 90), dmg, color, size);
    Effects.burst(e.x, W.groundY - 40, e.def.color, 8);
    if (e.hp <= 0) this.killEnemy(e);
  },

  killEnemy(e) {
    e.dead = true;
    e.mood = "dead";
    Effects.burst(e.x, W.groundY - 40, e.def.color, 22, 320);
    if (e.def.exp) this.gainExp(e.def.exp, e.x);
    if (e.isBoss) {
      this.shake(18, 0.8);
      for (let i = 0; i < 5; i++) {
        setTimeout(() => Effects.burst(e.x + (Math.random() - 0.5) * 120, W.groundY - 80, pick(["#facc15", "#ef4444", "#fff"]), 18, 380), i * 150);
      }
    }
  },

  // Enemy damages the player (dodge and upgrades apply).
  hitPlayer(base) {
    const p = this.player;
    if (p.dead) return;
    // A stored Dodge charge blocks exactly one attack.
    if (p.dodgeCharges > 0) {
      p.dodgeCharges--;
      p.play("dodge", 400);
      Effects.text(p.x, W.groundY - 130, "BLOCKED!", "#38bdf8", 24);
      return;
    }
    if (Math.random() < p.stats.dodgeChance) {
      p.play("dodge", 400);
      Effects.text(p.x, W.groundY - 130, "DODGED!", "#38bdf8", 24);
      return;
    }
    this.hurtPlayer(Math.round(base * p.stats.damageTaken));
  },

  hurtPlayer(dmg) {
    const p = this.player;
    p.hp = Math.max(0, p.hp - dmg);
    p.flash = 0.12;
    p.play("hurt", 450);
    p.setMood("hurt", 0.7);
    Effects.text(p.x, W.groundY - 130, "-" + dmg, "#f87171", 28);
    this.shake(6, 0.2);
    if (p.hp <= 0) {
      p.dead = true;
      p.mood = "dead";
    }
    this.refreshHud();
  },

  healPlayer(amount) {
    const p = this.player;
    const healed = Math.min(p.maxHp - p.hp, Math.round(amount * p.stats.healMult));
    p.hp += healed;
    Effects.text(p.x, W.groundY - 130, "+" + healed, "#4ade80", 28);
    return healed;
  },

  // Move the player forward, stopping in front of the first living enemy.
  movePlayer(dist) {
    const p = this.player;
    const ahead = this.enemies.filter(e => e.alive && e.x > p.x);
    const blocker = ahead.sort((a, b) => a.x - b.x)[0];
    const gap = blocker ? (blocker.isBoss ? 105 : CONFIG.player.minGapToEnemy) : 0;
    const maxX = blocker ? blocker.x - gap : W.levelLength - 60;
    const newX = Math.max(p.x, Math.min(p.x + dist, maxX));
    const moved = newX - p.x;
    p.x = newX;
    return moved;
  },

  gainExp(amount, x) {
    this.player.exp += amount;
    Effects.text(x, W.groundY - 160, `+${amount} EXP`, "#60a5fa", 20);
    this.refreshHud();
  },

  async handleLevelUps() {
    const p = this.player;
    while (p.exp >= p.expToNext && this.state === "playing" && !p.dead) {
      p.exp -= p.expToNext;
      p.level++;
      p.expToNext = Math.round(p.expToNext * CONFIG.exp.growth);
      this.refreshHud();
      await sleep(300);

      // 3 cards: Dice Bag swap(s) + random available upgrades, in random order.
      const swaps = Array.from({ length: CONFIG.bagSwap.cardsPerLevelUp }, () => this.makeBagSwapCard());
      const upgrades = CONFIG.upgrades
        .filter(u => !u.available || u.available(p))
        .sort(() => Math.random() - 0.5)
        .slice(0, 3 - swaps.length);
      const pool = [...swaps, ...upgrades].sort(() => Math.random() - 0.5);
      // ?auto=1 picks automatically (used for automated testing).
      const choice = params.has("auto") ? pool[0] : await UI.chooseUpgrade(p.level, pool);
      choice.apply(p);
      this.refreshBag(); // odds or slots may have changed
      if (choice.slot) UI.markSlot(choice.slot);
      p.setMood("happy", 1.2);
      Effects.rise(p.x, W.groundY - 80, "#facc15", 16);
      Effects.text(p.x, W.groundY - 150, choice.name + "!", "#facc15", 22);
      this.refreshHud();
      await sleep(400);
    }
  },

  checkEnd() {
    const ended = this.player.dead || this.boss.dead;
    if (ended) {
      const counts = Object.values(this.bag.timesRolled).join(",");
      document.title = `Dicebound - ${this.player.dead ? "DEFEATED" : "VICTORY"} turn=${this.turn} lv=${this.player.level} hp=${Math.ceil(this.player.hp)} progress=${this.progressPct()} bossHp=${this.boss.hp} rolls2to12=${counts}`;
    }
    if (this.player.dead) {
      this.state = "lost";
      UI.setAction("Your hero has fallen...", "bad");
      setTimeout(() => UI.showEnd(false,
        `Reached ${this.progressPct()}% of the level at LV ${this.player.level} after ${this.turn} rolls.`), 1400);
      return true;
    }
    if (this.boss.dead) {
      this.state = "won";
      this.player.setMood("happy", 999);
      this.player.play("victory", 1600);
      UI.setAction("The Evil D100 is defeated!", "heal");
      setTimeout(() => UI.showEnd(true,
        `You beat the level at LV ${this.player.level} with ${Math.ceil(this.player.hp)} HP left, in ${this.turn} rolls.`), 1600);
      return true;
    }
    return false;
  },

  progressPct() {
    const start = CONFIG.player.startX, end = CONFIG.boss.x;
    return Math.round(100 * Math.max(0, Math.min(1, (this.player.x - start) / (end - start))));
  },

  refreshHud() {
    UI.updateHud(this.player, `World 1 · ${this.progressPct()}%`);
    UI.updateBossBar(this.boss);
  },

  shake(mag, seconds) {
    this.shakeMag = mag;
    this.shakeT = seconds;
  },

  // -------------------------------------------------------------------
  // RENDERING
  // -------------------------------------------------------------------
  frame(now) {
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;

    this.player.update(dt);
    this.enemies.forEach(e => e.update(dt));
    Effects.update(dt);

    const targetCam = Math.max(0, Math.min(this.player.renderX - 260, W.levelLength - W.width + 120));
    this.camX += (targetCam - this.camX) * (1 - Math.exp(-dt * 4));
    if (this.shakeT > 0) this.shakeT -= dt;

    this.draw();
    requestAnimationFrame(t => this.frame(t));
  },

  draw() {
    const ctx = this.ctx;
    const cam = this.camX;
    const gy = W.groundY;

    // Sky
    ctx.fillStyle = "#bfe9ff";
    ctx.fillRect(0, 0, W.width, W.height);

    ctx.save();
    if (this.shakeT > 0) {
      ctx.translate((Math.random() - 0.5) * this.shakeMag, (Math.random() - 0.5) * this.shakeMag);
    }

    // Clouds (slow parallax)
    ctx.fillStyle = "#ffffff";
    for (let i = 0; i < 12; i++) {
      const x = i * 330 - cam * 0.2 + (i % 3) * 40;
      const y = 60 + (i % 3) * 40;
      ctx.beginPath();
      ctx.ellipse(x, y, 50, 18, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 30, y - 12, 32, 18, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Hills (mid parallax)
    for (let i = 0; i < 14; i++) {
      const x = i * 260 - cam * 0.45;
      ctx.fillStyle = i % 2 ? "#9ad98f" : "#86cf7c";
      ctx.beginPath();
      ctx.arc(x, gy + 40, 150 + (i % 3) * 30, Math.PI, 0);
      ctx.fill();
    }

    // World-space layer
    ctx.save();
    ctx.translate(-cam, 0);

    // Ground with stripes so movement is readable
    ctx.fillStyle = "#6cc35f";
    ctx.fillRect(cam - 50, gy, W.width + 100, 18);
    ctx.fillStyle = "#c98b55";
    ctx.fillRect(cam - 50, gy + 18, W.width + 100, W.height - gy);
    ctx.fillStyle = "#b97a46";
    for (let x = Math.floor(cam / 80) * 80; x < cam + W.width + 80; x += 80) {
      if ((x / 80) % 2 === 0) ctx.fillRect(x, gy + 18, 40, W.height - gy);
    }
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cam - 50, gy); ctx.lineTo(cam + W.width + 50, gy); ctx.stroke();

    this.drawSign(CONFIG.player.startX - 70, "START", "#3b82f6");
    this.drawSign(CONFIG.boss.x - 330, "BOSS!", "#dc2626");

    // Characters (enemies first so the player is drawn on top)
    for (const e of this.enemies) e.draw(ctx, gy);
    this.player.draw(ctx, gy);

    Effects.draw(ctx);
    ctx.restore();
    ctx.restore();
  },

  drawSign(x, text, color) {
    const ctx = this.ctx, gy = W.groundY;
    ctx.fillStyle = "#8b5e34";
    ctx.fillRect(x - 4, gy - 70, 8, 70);
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 3;
    ctx.strokeRect(x - 4, gy - 70, 8, 70);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(x - 40, gy - 100, 80, 34, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "800 16px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, x, gy - 83);
  }
};

// =====================================================================
// PLAYER ACTIONS - one function per action id in CONFIG.actions.
// Each one plays an animation and resolves when it is finished.
// =====================================================================
const actionMs = (mult = 1) => T.action * mult;

async function attackNearest(action, anim, opts = {}) {
  const p = Game.player;
  const target = Game.nearestEnemy(CONFIG.player.meleeRange);
  const dur = actionMs(opts.slow ? 1.4 : 1);
  p.play(anim, dur);
  p.setMood("angry", dur / 1000 / CONFIG.gameSpeed + 0.2);

  if (!target) {
    // Nothing to hit: swing at the air and stumble forward a little.
    Game.movePlayer(CONFIG.player.attackLunge);
    await sleep(dur * 0.5);
    Effects.text(p.x + 40, W.groundY - 120, pick(["*whoosh*", "Hit nothing!", "Take that, air!"]), "#e5e7eb", 18);
    await sleep(dur * 0.5);
    return;
  }

  await sleep(dur * (opts.slow ? 0.6 : 0.45));
  Game.damageEnemy(target, action.damage, opts.color, opts.size);
  if (opts.onHit) opts.onHit(target);
  await sleep(dur * (opts.slow ? 0.4 : 0.55));
}

const PlayerActions = {
  async takeDamage(action) {
    const p = Game.player;
    Effects.text(p.x, W.groundY - 165, pick(["Tripped!", "Stubbed a toe!", "Bit my tongue!", "Sneezed into my sword!"]), "#fca5a5", 18);
    Game.hurtPlayer(Math.max(1, Math.round(action.amount * p.stats.selfDamageMult)));
    await sleep(actionMs());
  },

  basicAttack: a => attackNearest(a, "attack"),

  heavyAttack: a => attackNearest(a, "heavy", {
    slow: true, color: "#fdba74", size: 32,
    onHit: () => Game.shake(8, 0.2)
  }),

  critAttack: a => attackNearest(a, "crit", {
    slow: true, color: "#facc15", size: 40,
    onHit: t => {
      Game.shake(14, 0.3);
      Effects.text(t.x, W.groundY - (t.isBoss ? 200 : 140), "CRIT!", "#facc15", 30);
      Effects.burst(t.x, W.groundY - 50, "#facc15", 20, 360);
    }
  }),

  async specialAttack(action) {
    const p = Game.player;
    p.play("special", actionMs(1.2));
    await sleep(actionMs(0.6));
    Effects.ring(p.x, W.groundY - 50, "#38bdf8", CONFIG.player.specialRange);
    const targets = Game.enemiesInRange(CONFIG.player.specialRange);
    if (!targets.length) Effects.text(p.x, W.groundY - 150, "Spin attack! (on nobody)", "#bae6fd", 18);
    targets.forEach(e => Game.damageEnemy(e, action.damage, "#7dd3fc", 30));
    Game.shake(6, 0.2);
    await sleep(actionMs(0.6));
  },

  async heal(action) {
    const p = Game.player;
    p.play("heal", actionMs());
    p.setMood("happy", 0.9);
    Effects.rise(p.x, W.groundY - 60, "#4ade80", 12);
    Game.healPlayer(action.amount);
    await sleep(actionMs());
  },

  async fullHeal() {
    const p = Game.player;
    p.play("fullheal", actionMs(1.4));
    p.setMood("happy", 1.5);
    Effects.rise(p.x, W.groundY - 60, "#facc15", 26);
    Effects.ring(p.x, W.groundY - 60, "#facc15", 140);
    p.hp = p.maxHp;
    Effects.text(p.x, W.groundY - 160, "FULL HP!!", "#facc15", 32);
    await sleep(actionMs(1.4));
  },

  async walk() {
    const p = Game.player;
    const moved = Game.movePlayer(CONFIG.player.walkDistance * p.stats.walkMult);
    p.play("walk", actionMs());
    if (moved < 5) Effects.text(p.x + 30, W.groundY - 140, "Blocked!", "#e5e7eb", 18);
    await sleep(actionMs());
  },

  async dodge() {
    const p = Game.player;
    const full = p.dodgeCharges >= CONFIG.maxDodgeCharges;
    p.dodgeCharges = Math.min(CONFIG.maxDodgeCharges, p.dodgeCharges + 1);
    p.play("dodge", actionMs());
    Effects.text(p.x, W.groundY - 150, full ? "Shield already up!" : "Shield up! Blocks next hit", "#38bdf8", 20);
    await sleep(actionMs());
  }
};

// =====================================================================
// BOSS ACTIONS - one function per id in CONFIG.boss.table.
// =====================================================================
const BossActions = {
  async basic(b, entry) {
    b.play("attack", T.enemyStep * 1.2);
    await sleep(T.enemyStep * 0.6);
    Game.hitPlayer(entry.damage);
    await sleep(T.enemyStep * 0.6);
  },

  async heavy(b, entry) {
    b.play("heavy", actionMs(1.2));
    await sleep(actionMs(0.6));
    Game.shake(10, 0.25);
    Game.hitPlayer(entry.damage);
    await sleep(actionMs(0.6));
  },

  async summon(b) {
    b.play("summon", actionMs());
    await sleep(actionMs(0.5));
    const minions = Game.enemies.filter(e => e.alive && !e.isBoss && e.x > Game.player.x).length;
    if (minions >= 2) {
      Effects.text(b.x, W.groundY - 160, "...but nobody came", "#e5e7eb", 18);
    } else {
      // Spawn between boss and player, never on top of the player.
      const m = new Enemy(CONFIG.boss.summonType, Math.max(Game.player.x + 85, b.x - 110));
      m.active = true;
      m.summoned = true;
      m.renderX = b.x;
      Game.enemies.push(m);
      Effects.burst(m.x, W.groundY - 30, "#a855f7", 20);
    }
    await sleep(actionMs(0.5));
  },

  async defend(b) {
    b.defending = true;
    Effects.text(b.x, W.groundY - 160, "DEFENSE UP", "#93c5fd", 22);
    await sleep(actionMs(0.8));
  },

  async devastate(b, entry) {
    b.play("devastate", actionMs(1.6));
    await sleep(actionMs(0.9));
    Effects.ring(b.x, W.groundY - 10, "#ef4444", 600);
    Game.shake(20, 0.45);
    Game.hitPlayer(entry.damage);
    await sleep(actionMs(0.7));
  },

  async fumble(b, entry) {
    b.play("fumble", actionMs(1.2));
    Effects.text(b.x, W.groundY - 190, "NAT 100... TRIPPED!", "#facc15", 24);
    await sleep(actionMs(0.5));
    b.hp = Math.max(0, b.hp - entry.selfDamage);
    b.flash = 0.2;
    Effects.text(b.x, W.groundY - 150, "-" + entry.selfDamage, "#facc15", 34);
    if (b.hp <= 0) Game.killEnemy(b);
    await sleep(actionMs(0.7));
  }
};

window.addEventListener("load", () => Game.init());
  </script>
</body>
